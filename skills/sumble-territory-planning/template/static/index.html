<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Territory planning</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <header class="topbar">
      <a href="https://sumble.com" class="brand" target="_blank" rel="noopener">
        <img class="brand-icon" src="https://sumble.com/logo512.png" alt="" />
        <img class="brand-wordmark" src="https://sumble.com/img/sumble-wordmark.svg" alt="Sumble" />
      </a>
      <div class="topbar-meta">
        <span id="customer-name"></span>
        <span class="dot">·</span>
        <span id="row-summary"></span>
        <div class="btn-stack">
          <button id="export-actions" class="btn-download"
                  title="Download every accepted / manual owner change as a CRM-ready sheet">
            Export approved moves</button>
          <button id="export-sheet" class="btn-download btn-download-secondary"
                  title="Download the full territory sheet, including every flag and activity count">
            Download territory.csv</button>
        </div>
      </div>
    </header>

    <main class="terr-layout">
      <!-- ================= Calibrate sidebar ================= -->
      <aside class="calibrate-panel" id="calibrate-panel">
        <div class="panel-header">
          <h2>Top N</h2>
        </div>
        <p class="panel-sub">Best accounts per rep to compare, by segment.</p>
        <div id="ks-topn-fields"></div>

        <div class="calibrate-actions">
          <button id="calibrate-reset-fields" class="btn-link" type="button">Reset</button>
        </div>
      </aside>

      <section class="terr-main">
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="overview" role="tab">Overview</button>
          <button class="tab" data-tab="changes" role="tab">Changes</button>
        </nav>
        <p id="tab-description" class="tab-description"></p>

      <!-- ================= Overview ================= -->
      <section id="view-overview" class="view">
        <div id="overview-segments"></div>
      </section>

      <!-- ================= One rep's book (opened from the Overview) ======= -->
      <section id="view-rep" class="view hidden">
        <p class="rep-back"><a href="#" id="rep-back">← All reps</a></p>
        <h3 class="terr-h3" id="rep-title"></h3>
        <p class="eval-diag-sub" id="rep-meta"></p>
        <div id="rep-filters" class="filter-rows"></div>
        <div class="search-wrap">
          <input id="search-input" type="search"
                 placeholder="Search name or domain… (press / to focus)" autocomplete="off" />
        </div>
        <div class="table-wrap">
          <table id="accounts-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="page-prev" class="btn-page" type="button">‹ Prev</button>
          <span id="page-info" class="page-info"></span>
          <button id="page-next" class="btn-page" type="button">Next ›</button>
        </div>
      </section>

      <!-- ================= Changes ================= -->
      <section id="view-changes" class="view hidden">
        <div id="changes-summary" class="export-summary"></div>
        <div class="btn-stack btn-stack-row">
          <button id="export-actions-2" class="btn-download">Download actions.csv</button>
          <button id="export-sheet-2" class="btn-download btn-download-secondary">Download territory.csv</button>
        </div>
        <h3 class="terr-h3">Proposed changes</h3>
        <div id="changes-filters" class="filter-rows"></div>
        <div class="table-wrap">
          <table id="changes-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <h3 class="terr-h3">Log</h3>
        <p class="eval-diag-sub">Every decision made in this app, newest first.</p>
        <div class="table-wrap">
          <table id="log-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      </section>
    </main>

    <aside id="detail-panel" class="detail-panel hidden">
      <div class="breakdown-header">
        <div>
          <h2 id="detail-name"></h2>
          <p id="detail-meta"></p>
        </div>
        <button id="detail-close" class="btn-icon" aria-label="Close">×</button>
      </div>
      <div id="detail-body"></div>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
